# Business Context Configuration for SPECTER
# ==========================================
#
# This file defines the asset criticality mappings, business unit structures,
# data sensitivity classifications, and response time requirements used by
# the enhanced SPECTER scoring engine.
#
# Use this file to customize the business impact model for your environment.
# If an asset ARN is not found here, it will be classified by default rules
# based on its service family (AWS, Azure, GCP) and resource type.
#
# ## Structure
#
# ```yaml
# business_units:
#   - name: "Engineering"
#     criticality_tier: 2
#     data_sensitivity: "internal"
#     optimal_response_hours: 4
#     sla_breach_risk: true
#
# assets:
#   - arn: "arn:aws:iam::123456789012:access-key/..."
#     asset_class: "identity"
#     business_unit: "Engineering"
#     criticality_tier: 2
#     data_sensitivity: "internal"
#     impact_if_compromised: "high"
#     sla_breach_risk: true
#     recovery_rto: "2h"
#
# asset_defaults:
#   iam:
#     compute: 2
#     data: 2
#     network: 4
#     identity: 2
#     security: 1
# ```
#
# ## Field Definitions
#
# ### business_units
#
# The organizational structure and their characteristics.
#
# | Field            | Type   | Required | Options                           |
# |------------------|--------|----------|-----------------------------------|
# | name             | string | ✓        | Any (e.g., "Finance", "Prod")      |
# | criticality_tier | int    | ✓        | 1-4 (1 = most critical)            |
# | data_sensitivity | string | ✓        | pci\|phii\|customer\|internal\|public |
# | optimal_response_hours | int  | ✓        | 1, 4, 24, or 168 (hours)           |
# | sla_breach_risk  | bool   | ✓        | true or false                     |
#
# ### assets
#
# Specific asset definitions. Keys by ARN string.
#
# | Field              | Type       | Required | Options                                               |
# |--------------------|------------|----------|-------------------------------------------------------|
# | arn                | string     | ✓        | Full ARN (used as lookup key)                          |
# | asset_class        | string     | ✓        | compute\|data\|network\|identity\|security             |
# | business_unit      | string     | ✗        | Name from business_units                              |
# | criticality_tier   | int        | ✗        | 1-4                                                   |
# | data_sensitivity   | string     | ✗        | pci\|phii\|customer\|internal\|public                  |
# | impact_if_compromised | string | ✗        | severe\|high\|moderate\|low                            |
# | sla_breach_risk    | bool       | ✗        | true or false                                         |
# | recovery_rto       | string     | ✗        | ISO 8601 duration (e.g., "1h", "4h", "24h", "7d")      |
#
# ### asset_defaults
#
# Default classifications for assets not explicitly defined. Grouped by cloud provider.
#
# ```yaml
# asset_defaults:
#   aws:
#     iam:
#       compute: 2
#       data: 2
#       network: 4
#       identity: 2
#       security: 1
#     s3:
#       compute: 1
#       data: 1
#       network: 4
#       identity: 4
#       security: 4
#     ecs:
#       compute: 2
#       data: 2
#       network: 2
#       identity: 2
#       security: 2
#     lambda:
#       compute: 1
#       data: 1
#       network: 2
#       identity: 2
#       security: 2
#   azure:
#     identity:
#       compute: 2
#       data: 2
#       network: 4
#       identity: 2
#       security: 1
# ```
#
# ## Default Data Sensitivity Rules
#
# | Resource Type       | Default Sensitivity |
# |---------------------|---------------------|
# | IAM access keys     | internal            |
# | IAM roles           | internal            |
# | S3 buckets          | public              |
# | RDS instances       | internal            |
# | DynamoDB tables     | internal            |
# | Secrets Manager     | secret              |
# | KMS keys            | secret              |
# | API Gateway configs | internal            |
# | Lambda functions    | internal            |
# | EC2 instances       | internal            |
# | VPC Flow Logs       | internal            |
# | CloudTrail logs     | internal            |
#
# ## Default Response Effort by Action Type
#
# | Action Type         | Default Effort Level |
# |--------------------|---------------------|
# | revoke             | 2                   |
# | rotate             | 2                   |
# | terminate          | 1                   |
# | isolate            | 2                   |
# | update_acl         | 2                   |
# | download_logs      | 4                   |
# | analyze            | 3                   |
# | patch              | 3                   |
# | reconfigure        | 3                   |
# | reset_credentials  | 2                   |
# | block_ip           | 1                   |
# | quarantine         | 3                   |
#
# ## Response Effort by Cloud Provider
#
# | Provider   | Effort Multiplier |
# |------------|-------------------|
# | AWS        | 1.0               |
# | Azure      | 1.2               |
# | GCP        | 1.2               |
# | Multi-cloud | 1.5               |
#
# ## Scoring Weight Configurations
#
# The enhanced scoring model weights are defined here and applied in the
# Scoring Engine (`services/scoring_engine.py`).
#
# ```yaml
# scoring_weights:
#   business_impact: 0.40
#   threat_confidence: 0.30
#   response_effort: 0.20
#   evidence_quality: 0.10
# ```
#
# Priority Tier Thresholds:
#
# | Priority  | Composite Score Range |
# |-----------|----------------------|
# | critical  | >= 7.5               |
# | high      | 5.0 - 7.4            |
# | medium    | 2.5 - 4.9            |
# | low       | < 2.5                |
#
# ## Response Effort Calculation
#
# Effort is calculated as a lookup from the action type, scaled by
# cloud provider multiplier, and adjusted for resource count.
#
# ```
# effort = base_effort[action_type] * provider_multiplier * resource_count
# ```
#
# Effort Level Mapping:
#
# | Effort Level | Score Range |
# |-------------|-------------|
# | 1 - Quick   | 0 - 0.5     |
# | 2 - Moderate| 0.5 - 1.5   |
# | 3 - Standard| 1.5 - 2.5   |
# | 4 - Complex | 2.5 - 3.5   |
# | 5 - Major   | 3.5+        |

business_units:
  - name: "Finance"
    criticality_tier: 1
    data_sensitivity: "pci"
    optimal_response_hours: 1
    sla_breach_risk: true
    rationale: Payment processing and financial transactions. Compromise impacts customers and regulatory compliance.

  - name: "Customer Data"
    criticality_tier: 1
    data_sensitivity: "customer"
    optimal_response_hours: 1
    sla_breach_risk: true
    rationale: Customer PII and personally identifiable information at risk.

  - name: "Engineering Prod"
    criticality_tier: 2
    data_sensitivity: "internal"
    optimal_response_hours: 4
    sla_breach_risk: false
    rationale: Production build and CI/CD infrastructure. Critical for product delivery.

  - name: "Operations"
    criticality_tier: 2
    data_sensitivity: "internal"
    optimal_response_hours: 4
    sla_breach_risk: true
    rationale: Infrastructure management and security operations.

  - name: "Customer Facing"
    criticality_tier: 2
    data_sensitivity: "customer"
    optimal_response_hours: 4
    sla_breach_risk: true
    rationale: Public-facing APIs and customer portals.

  - name: "Development"
    criticality_tier: 3
    data_sensitivity: "internal"
    optimal_response_hours: 24
    sla_breach_risk: false
    rationale: Development environments and non-sensitive code.

  - name: "Public CDN"
    criticality_tier: 4
    data_sensitivity: "public"
    optimal_response_hours: 168
    sla_breach_risk: false
    rationale: Public content delivery network. Low blast radius.

  - name: "Security Monitoring"
    criticality_tier: 3
    data_sensitivity: "internal"
    optimal_response_hours: 4
    sla_breach_risk: true
    rationale: Security tools and monitoring infrastructure.

