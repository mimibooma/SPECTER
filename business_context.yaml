  high: 5.0
  medium: 2.5
  low: 0.0

response_effort_map:
  revoke: 2
  rotate: 2
  terminate: 1
  isolate: 2
  update_acl: 2
  download_logs: 4
  analyze: 3
  patch: 3
  reconfigure: 3
  reset_credentials: 2
  block_ip: 1
  quarantine: 3
  collect: 4
  verify: 1
